[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-bridge"
version = "0.2.0"
description = "Expose an authenticated ChatGPT web session to MCP clients via a real browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "chatgpt", "playwright", "hermes", "claude-code", "llm", "agent"]
dependencies = [
    "playwright>=1.40",
    "mcp>=1.2,<2",
    "uvicorn>=0.27",
]

[project.scripts]
pro-bridge = "pro_bridge.server:main"

[tool.setuptools]
packages = ["pro_bridge"]
